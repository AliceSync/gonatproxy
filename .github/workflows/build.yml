name: gonatproxy build

on:
  workflow_dispatch:
  push:
    branches: ["main"]
    tags: ["v*"]
  pull_request:
    branches: ["main"]

jobs:
  build:
    name: Build ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            goos: linux
            goarch: amd64
            name: linux-amd64
            ext: ""
          - os: ubuntu-latest
            goos: linux
            goarch: arm64
            name: linux-arm64
            ext: ""
          - os: windows-latest
            goos: windows
            goarch: amd64
            name: windows-amd64
            ext: ".exe"
          - os: macos-latest
            goos: darwin
            goarch: amd64
            name: darwin-amd64
            ext: ""
          - os: macos-latest
            goos: darwin
            goarch: arm64
            name: darwin-arm64
            ext: ""

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.22"

      - name: Build binaries and package config
        shell: bash
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: 0
        run: |
          set -euo pipefail

          artifact_dir="dist/${{ matrix.name }}"
          mkdir -p "$artifact_dir/bin"
          mkdir -p "$artifact_dir/configs"

          go build -trimpath -ldflags="-s -w" -o "$artifact_dir/bin/deepseek-server${{ matrix.ext }}" ./cmd/server
          go build -trimpath -ldflags="-s -w" -o "$artifact_dir/bin/deepseek-client${{ matrix.ext }}" ./cmd/client
          go build -trimpath -ldflags="-s -w" -o "$artifact_dir/bin/deepseek-natclient${{ matrix.ext }}" ./cmd/natclient

          cp config.json "$artifact_dir/config.json"
          cp -r configs/. "$artifact_dir/configs/"
          cp -r scripts "$artifact_dir/scripts"
          cp -r systemd "$artifact_dir/systemd"

          echo "Build output:" 
          find "$artifact_dir" -maxdepth 2 -type f | sort

      - name: Archive artifact
        shell: bash
        run: |
          set -euo pipefail
          cd dist

          if [ "${{ matrix.goos }}" = "windows" ]; then
            zip -r "gonatproxy-${{ matrix.name }}.zip" "${{ matrix.name }}"
          else
            tar -czf "gonatproxy-${{ matrix.name }}.tar.gz" "${{ matrix.name }}"
          fi

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: gonatproxy-${{ matrix.name }}
          path: dist/gonatproxy-${{ matrix.name }}.*
          if-no-files-found: error
          retention-days: 30
