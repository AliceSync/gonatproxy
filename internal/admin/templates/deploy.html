<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>部署助手 - DeepSeek Tunnel</title>
<link rel="stylesheet" href="/static/style.css">
<link rel="icon" href="/static/favicon.svg" type="image/svg+xml">
<script src="/static/app.js"></script>
</head>
<body>
  <nav class="navbar"><div class="nav-brand">◈ DeepSeek Tunnel</div>
    <div class="nav-links"><a href="/dashboard">概览</a><a href="/config">配置</a><a href="/files">文件</a>
      <a href="/deploy" class="active">部署</a><a href="/services">服务</a><a href="/system">系统</a><a href="/logout">退出</a></div>
  </nav>
  <main class="container" id="view">
    <div class="page-head">
      <h2>部署助手</h2>
      <span class="muted" id="statusLine">加载中…</span>
    </div>
    <p class="muted">
      为没有图形界面的 <code>client</code>/<code>natclient</code> 主机生成<b>一条可直接复制执行的安装命令</b>：
      该命令会从本服务器下载对应二进制与配置、写入 <code>/usr/local/bin</code> 与
      <code>/etc/deepseek</code>、生成并启用、启动 systemd 单元。命令内置 15 分钟的部署令牌。
    </p>

    <div class="panel" style="display:flex; gap:24px; align-items:center; flex-wrap:wrap">
      <label class="muted" style="font-size:13px">目标架构
        <select id="deployArch" style="width:auto; margin:4px 0 0">
          <option value="auto">自动（按服务器自身，也可能是单一可用架构）</option>
          <option value="amd64">amd64 (x86_64)</option>
          <option value="arm64">arm64 (aarch64)</option>
        </select>
      </label>
      <label class="check-row" style="padding-top:6px; font-size:13px; color:var(--muted)">
        <input type="checkbox" id="useSudo" checked> 命令使用 <code>sudo</code> 提权（目标主机已是 root 时取消勾选）
      </label>
      <label class="muted" style="font-size:13px">前置代理（可选）
        <input type="text" id="proxy" style="width:320px; margin:4px 0 0" placeholder="socks5://user:pass@127.0.0.1:1080  或 sock4/4a://…、http://…">
      </label>
      <span class="muted" id="archLine"></span>
    </div>

    <div class="panel">
      <h3>入口客户端 (client)</h3>
      <label class="check-row" style="padding-top:0">
        <select id="trustClient" style="width:auto; margin:0">
          <option value="insecure">暂用 insecure_skip_verify（测试/内网）</option>
          <option value="manual">不修改信任（我将手动配置 ca_file/指纹）</option>
        </select>
      </label>
      <div class="actions"><button class="btn btn-primary" onclick="gen('client')">生成安装命令</button></div>
      <pre class="code" id="cmdClient"></pre>
    </div>

    <div class="panel">
      <h3>NAT 客户端 (natclient)</h3>
      <label class="check-row" style="padding-top:0">
        <select id="natId" style="width:auto; margin:0"></select>
        <select id="trustNat" style="width:auto; margin:0">
          <option value="insecure">暂用 insecure_skip_verify（测试/内网）</option>
          <option value="manual">不修改信任（我将手动配置 ca_file/指纹）</option>
        </select>
      </label>
      <div class="actions"><button class="btn btn-primary" onclick="gen('natclient')">生成安装命令</button></div>
      <pre class="code" id="cmdNat"></pre>
    </div>

    <div class="panel">
      <h3>复制下载地址（不含命令）</h3>
      <p class="muted" id="boxInfo"></p>
    </div>
  </main>
<script src="/static/dialog.js"></script>
<script>
(function(){
  let state = null;
  const $ = s => document.querySelector('#' + s); // query by element id
  const esc = s => String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");

  function loadStatus(){
    fetch('/api/deploy/status').then(r=>r.json()).then(d=>{
      document.getElementById('statusLine').textContent = d.enabled
        ? '二进制目录：' + (d.deploy_dir||'') + '   服务器地址：' + (d.server||'')
        : '未启用：请在配置页设置 deploy_dir，或为我放置 deepseek-client/natclient 二进制到服务器同一目录';
      if (!d.enabled){ document.getElementById('statusLine').classList.add('badge','badge-warn'); return; }
      document.getElementById('archLine').textContent =
        '服务器架构：' + d.server_arch + '    可用架构：' + ((d.archs||[]).length ? d.archs.join(' / ') : '（无，请先在服务器上运行 scripts/build.sh）');
      const natSel = document.getElementById('natId');
      natSel.innerHTML = '';
      (d.nat_ids||[]).forEach(id=>{ const o=document.createElement('option'); o.value=id; o.textContent=id; natSel.appendChild(o); });
      if (!(d.nat_ids||[]).length){ natSel.innerHTML='<option value="">（尚无 NAT 客户端，请在「配置」页添加后刷新本页）</option>'; }
      const missing = Object.keys(d.binaries||{}).filter(k=>!(d.binaries[k]&&d.binaries[k].length));
      if (missing.length) document.getElementById('statusLine').textContent += '   注意缺失:'+missing.join(',');
      state = d;
    }).catch(()=>{});
  }

  function token(){ return fetch('/api/deploy/token').then(r=>r.json()).then(d=>d.token); }

  function build(role){
    const base = 'https://' + (location.host);
    const trust = (role==='client'? $('trustClient').value : $('trustNat').value);
    const arch = $('deployArch').value;
    const useSudo = $('useSudo').checked;
    const S = useSudo ? 'sudo ' : '';
    const proxyVal = ($('proxy').value||'').trim();
    const PX = proxyVal ? ' -x "$PX"' : '';
    const binName = 'deepseek-' + role;
    let binURL = base + '/api/deploy/' + binName;
    if (arch && arch!=='auto') binURL += '?arch=' + arch;
    const archLabel = (arch==='auto') ? ('auto(服务器:'+(state&&state.server_arch||'?')+')') : arch;
    let cfgURL, cfgPath, cfgName;
    if (role === 'client') { cfgName='client.json'; cfgPath='/etc/deepseek/client.json'; cfgURL=base+'/api/deploy/cfg/client.json'; }
    else { const id=$('natId').value || ''; cfgName='natclient-'+id+'.json'; cfgPath='/etc/deepseek/'+cfgName; cfgURL=base+'/api/deploy/cfg/natclient/'+id+'.json'; }
    if (proxyVal) cfgURL += (cfgURL.includes('?')?'&':'?') + 'proxy=' + encodeURIComponent(proxyVal);
    const sedLine = trust==='insecure'
      ? S + "sed -i 's/\"insecure_skip_verify\": false/\"insecure_skip_verify\": true/' " + cfgPath
      : "# 不修改信任; 你可自行编辑 " + cfgPath + " 设置 ca_file 或 server_fingerprint";
    const sudoNote = useSudo
      ? '# 本命令用 sudo 提权执行；首次执行会提示输入 sudo 密码\nsudo -v || { echo "sudo 验证失败"; exit 1; }'
      : '# 请在 root 下直接执行（或已以 root 登录）';
    const proxyNote = proxyVal ? '# 前置代理: ' + proxyVal : '# 未配置前置代理';
    return `#!/usr/bin/env bash
set -euo pipefail
# DeepSeek 部署助手生成
# 断网自动重试(最多5次/间隔4s)与超时，避免反复创建连接或卡死。
# 部署令牌 15 分钟有效；若重试后仍失败，重新在服务器上生成命令即可拿到新令牌。
# 目标架构: ${archLabel}
${proxyNote}
${sudoNote}
TOK='__DEPLOY_TOKEN__'
PX='${proxyVal}'
${S}mkdir -p /usr/local/bin /etc/deepseek
# 1) 下载二进制（断网自动重试，最多5次/间隔4s；附超时防止卡死）
${S}curl -fkS${PX} --retry 5 --retry-delay 4 --retry-all-errors --connect-timeout 10 --max-time 900 -H "Authorization: Bearer $TOK" -o /usr/local/bin/${binName} "${binURL}"
${S}chmod +x /usr/local/bin/${binName}
# 2) 下载配置
${S}curl -fkS${PX} --retry 5 --retry-delay 4 --retry-all-errors --connect-timeout 10 --max-time 120 -H "Authorization: Bearer $TOK" -o ${cfgPath} "${cfgURL}"
${sedLine}
# 3) 生成并启用、启动 systemd 单元（enable 与 start 分开）
${S}/usr/local/bin/${binName} -config ${cfgPath} service install
${S}/usr/local/bin/${binName} -config ${cfgPath} service start
`;
  }

  window.gen = function(role){
    const cmd = build(role);
    const preId = role==='client'?'cmdClient':'cmdNat';
    // replace placeholder TOK with a fresh token
    token().then(tk=>{
      document.getElementById(preId).textContent = cmd.replace(/__DEPLOY_TOKEN__/g, tk).trimEnd();
    }).catch(e=>{ document.getElementById(preId).textContent='获取令牌失败: '+e; });
  };
  document.querySelectorAll('pre').forEach(p=>{ p.style.cursor='pointer'; p.title='点击复制'; p.addEventListener('click',function(){ if(!this.textContent.trim())return; navigator.clipboard && navigator.clipboard.writeText(this.textContent); }); });

  loadStatus();
})();
</script>
<style>
.code { background: var(--bg2); border: 1px solid var(--border); border-radius: 10px; padding: 14px; font-family: ui-monospace, Menlo, Consolas, monospace; font-size: 13px; line-height: 1.5; white-space: pre-wrap; word-break: break-word; overflow-wrap: anywhere; margin: 10px 0 4px; color: #cfe3ff; }
</style>
</body>
</html>
