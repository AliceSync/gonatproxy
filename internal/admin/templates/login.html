<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DeepSeek Tunnel 控制台 - 登录</title>
<link rel="stylesheet" href="/static/style.css">
<link rel="icon" href="/static/favicon.svg" type="image/svg+xml">
</head>
<body class="auth-body">
  <div class="auth-card">
    <div class="brand">
      <div class="logo">◈</div>
      <div>
        <h1>DeepSeek Tunnel</h1>
        <p>管理控制台 · 登录</p>
      </div>
    </div>
    <div id="err" class="alert alert-error hidden"></div>
    <form id="loginForm" class="form" novalidate>
      <label>用户名
        <input type="text" name="username" autocomplete="username" required>
      </label>
      <label>密码
        <input type="password" name="password" autocomplete="current-password" required>
      </label>
      <button type="submit" class="btn btn-primary btn-block">登 录</button>
    </form>
  </div>

  <script>
    document.getElementById('loginForm').addEventListener('submit', function(e){
      e.preventDefault();
      var f = this, fd = new FormData(f);
      var err = document.getElementById('err');
      err.classList.add('hidden');
      var btn = f.querySelector('button[type=submit]'); btn.disabled = true; var old = btn.textContent; btn.textContent='登录中…';
      fetch('/login', { method:'POST', body: fd, headers:{'X-Requested-With':'fetch','Accept':'application/json'} })
        .then(function(resp){ return resp.json().catch(function(){ return {error:'网络错误'}; }).then(function(j){ return {code:resp.status, j:j}; }); })
        .then(function(x){
          btn.disabled=false; btn.textContent=old;
          if (x.code===200 && x.j.to) { window.location.href = x.j.to; return; }
          err.textContent = x.j.error || '登录失败'; err.classList.remove('hidden');
        })
        .catch(function(){ btn.disabled=false; btn.textContent=old; err.textContent='网络错误'; err.classList.remove('hidden'); });
    });
  </script>
</body>
</html>
