<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DeepSeek Tunnel 首次初始化</title>
<link rel="stylesheet" href="/static/style.css">
</head>
<body class="auth-body">
  <div class="auth-card">
    <div class="brand">
      <div class="logo">⚙</div>
      <div>
        <h1>首次初始化</h1>
        <p>创建管理账号（验证码 + 账号密码）</p>
      </div>
    </div>
    {{if .Error}}<div class="alert alert-error">{{.Error}}</div>{{end}}
    <form method="post" action="/setup" class="form">
      <input type="hidden" name="captcha_token" id="captcha_token">
      <label>管理员用户名
        <input type="text" name="username" minlength="3" required>
      </label>
      <label>密码（至少8位）
        <input type="password" name="password" minlength="8" required>
      </label>
      <label>确认密码
        <input type="password" name="password2" minlength="8" required>
      </label>
      <label class="captcha-row">
        <span>验证码</span>
        <img id="captcha_img" src="/captcha" alt="验证码" title="点击刷新">
        <input type="text" name="captcha" class="captcha-input" autocomplete="off" required placeholder="输入图中字符">
      </label>
      <button type="submit" class="btn btn-primary btn-block">创建并进入</button>
    </form>
  </div>
  <script>
    const img = document.getElementById('captcha_img');
    const tokenIn = document.getElementById('captcha_token');
    function refresh() {
      fetch('/captcha').then(r => {
        const t = r.headers.get('X-Captcha-Token');
        if (t) tokenIn.value = t;
        return r.blob();
      }).then(b => { img.src = URL.createObjectURL(b); });
    }
    img.addEventListener('click', refresh);
    refresh();
  </script>
</body>
</html>
