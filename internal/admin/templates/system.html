<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>系统 - DeepSeek Tunnel</title>
<link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <nav class="navbar"><div class="nav-brand">◈ DeepSeek Tunnel</div>
    <div class="nav-links"><a href="/dashboard">概览</a><a href="/config">配置</a><a href="/files">文件</a>
      <a href="/services">服务</a><a href="/system" class="active">系统</a><a href="/logout">退出</a></div>
  </nav>
  <main class="container">
    <div class="page-head">
      <h2>系统 / 更新</h2>
      <div class="muted">当前版本 {{.Version}} &nbsp;·&nbsp; <a href="/services">服务管理</a></div>
    </div>

    <div id="probe" class="panel">
      <h3>进程状态 <span class="badge badge-info" id="probeSystemd" style="margin-left:10px">检测中…</span></h3>
      <p class="muted" id="probeText">正在读取…</p>
    </div>

    <section class="panel">
      <h3>更新程序</h3>
      <p class="muted">选择新的 <code>deepseek-server</code> 可执行文件。可先上传暂存，稍后应用到当前程序；也可上传后立即替换并重启。</p>
      <input type="file" id="binFile" class="input-inline">
      <label class="check-row" style="padding-top:6px"><input type="checkbox" id="restartNow"> 上传后立即替换并重启（mv 替换 + fork 启动）</label>
      <div class="actions">
        <button class="btn btn-primary" onclick="uploadUpdate()">上传更新</button>
        <button class="btn btn-danger" id="applyBtn" onclick="applyStaged()">应用已上传的更新并重启</button>
      </div>
      <div class="muted" id="stagedNote"></div>
    </section>

    <section class="panel">
      <h3>重启服务</h3>
      <p class="muted" id="restartHint"></p>
      <div class="actions">
        <button class="btn btn-danger" onclick="restartNowFn()">立即重启当前服务</button>
      </div>
    </section>

    <div id="res" class="alert hidden"></div>
  </main>
<script src="/static/dialog.js"></script>
<script src="/static/system.js"></script>
</body>
</html>
